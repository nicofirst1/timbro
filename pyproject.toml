[project]
name = "timbro"
version = "0.7.0"
description = "Measure the timbre of your writing as a metric space and get an interpretable, content-preserving direction to revise a draft toward your voice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["writing", "style", "voice", "nlp", "spacy", "editing", "linting"]
authors = [{ name = "Nicolo' Brandizzi" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.27.2",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.5.1",
    "spacy>=3.8.14",
    # Word-frequency lookup for the density rubric's jargon_cluster check (#5); ships its
    # own bundled frequency data, no network at check time.
    "wordfreq>=3.1.1",
    "textdescriptives>=2.8.2",
    "lexical-diversity>=0.1.1",
    # lexical-diversity imports pkg_resources at module load time. setuptools isn't
    # guaranteed present in a `uv tool install` env, and setuptools>=81 dropped
    # pkg_resources entirely, so pin below that boundary (#42).
    "setuptools<81",
]

[project.urls]
Homepage = "https://github.com/nicofirst1/timbro"
Repository = "https://github.com/nicofirst1/timbro"
Issues = "https://github.com/nicofirst1/timbro/issues"

# PyPI rejects package metadata containing a direct-URL dependency. The en_core_web_sm
# wheel pin therefore lives in this dev-only group -- excluded from the built
# sdist/wheel metadata -- so `uv sync` in this repo (and the plugin's cache sync)
# still gets it pinned with no network surprise, while `pip install timbro` /
# `uvx timbro` fall back to a lazy spacy.cli.download() on first use (see
# src/timbro/spacy_model.py).
[dependency-groups]
dev = [
    "pytest>=8",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
timbro = "timbro.cli:main"
timbro-mcp = "timbro.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # dev group's en_core_web_sm wheel is a direct URL dependency
